name: CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  GO_VERSION: "1.24"

jobs:
  # ─────────── Stage 1: Lint ───────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m

  # ─────────── Stage 2: Test ───────────
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run unit tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  # ─────────── Stage 3: Build ───────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build binary
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o server .

      - name: Verify binary
        run: file server && ls -lh server

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-binary
          path: server

  # ─────────── Stage 4: Smoke Test ───────────
  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build binary
        run: CGO_ENABLED=0 go build -o server .

      - name: Start server in background
        run: |
          ./server &
          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV
          sleep 3

      - name: Smoke test - Health endpoint
        run: |
          echo "Testing /health..."
          HTTP_CODE=$(curl -s -o /tmp/health.json -w "%{http_code}" http://localhost:8080/health)
          echo "HTTP code: $HTTP_CODE"
          echo "Response: $(cat /tmp/health.json)"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "FAIL: expected 200, got $HTTP_CODE"
            exit 1
          fi
          # Validate JSON body
          STATUS=$(jq -r '.status' /tmp/health.json)
          if [ "$STATUS" != "ok" ]; then
            echo "FAIL: expected status=ok, got $STATUS"
            exit 1
          fi
          echo "PASS: /health returned 200 with status=ok"

      - name: Smoke test - API endpoint
        run: |
          echo "Testing /api?name=CI..."
          HTTP_CODE=$(curl -s -o /tmp/api.json -w "%{http_code}" "http://localhost:8080/api?name=CI")
          echo "HTTP code: $HTTP_CODE"
          echo "Response: $(cat /tmp/api.json)"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "FAIL: expected 200, got $HTTP_CODE"
            exit 1
          fi
          MSG=$(jq -r '.message' /tmp/api.json)
          if [ "$MSG" != "Hello, CI!" ]; then
            echo "FAIL: expected message='Hello, CI!', got $MSG"
            exit 1
          fi
          echo "PASS: /api returned 200 with correct message"

      - name: Smoke test - 404 on unknown path
        run: |
          echo "Testing /unknown..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/unknown)
          echo "HTTP code: $HTTP_CODE"
          if [ "$HTTP_CODE" = "404" ] || [ "$HTTP_CODE" = "200" ]; then
            echo "INFO: got $HTTP_CODE (Go default mux returns 404 for unknown paths)"
          fi
          echo "PASS: server handled unknown path gracefully"

      - name: Cleanup
        if: always()
        run: |
          kill ${{ env.SERVER_PID }} 2>/dev/null || true

  # ─────────── Stage 5: Docker Build & Push to zot (self-hosted runner) ───────────
  docker:
    name: Build & Push to Zot Registry
    runs-on: [self-hosted, zot]
    needs: smoke-test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    env:
      ZOT_REGISTRY: localhost:30149
      IMAGE_NAME: go-cicd-demo
    steps:
      - uses: actions/checkout@v4

      - name: Configure Docker for insecure registry
        run: |
          sudo python3 -c "
          import json
          with open('/etc/docker/daemon.json') as f: cfg=json.load(f)
          cfg.setdefault('insecure-registries', [])
          if '$ZOT_REGISTRY' not in cfg['insecure-registries']:
              cfg['insecure-registries'].append('$ZOT_REGISTRY')
          with open('/etc/docker/daemon.json','w') as f: json.dump(cfg,f,indent=2)
          "
          sudo systemctl restart docker
          sleep 3

      - name: Login to Zot registry
        run: echo "${{ secrets.ZOT_PASSWORD }}" | docker login ${{ env.ZOT_REGISTRY }} -u zot --password-stdin
      - name: Build Docker image
        run: |
          docker build -t ${{ env.ZOT_REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
                       -t ${{ env.ZOT_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} .

      - name: Push to Zot registry
        run: |
          docker push ${{ env.ZOT_REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.ZOT_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Smoke test Docker container
        run: |
          docker run -d -p 9090:8080 ${{ env.ZOT_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          sleep 3
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:9090/health)
          echo "Docker container health: HTTP $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "FAIL: container health check failed"
            exit 1
          fi
          echo "PASS: Docker container smoke test passed"
          docker stop $(docker ps -q) 2>/dev/null || true

      - name: Verify image in registry
        run: |
          echo "Checking registry catalog..."
          curl -s -u zot:${{ secrets.ZOT_PASSWORD }} http://${{ env.ZOT_REGISTRY }}/v2/_catalog
          echo
          echo "Checking tags..."
          curl -s -u zot:${{ secrets.ZOT_PASSWORD }} http://${{ env.ZOT_REGISTRY }}/v2/${{ env.IMAGE_NAME }}/tags/list
          echo
